name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out NAGINATA
        uses: actions/checkout@v4

      - name: Check out VST3 SDK and VSTGUI
        run: |
          git clone --depth 1 --recursive --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          ls vst3sdk/cmake/modules | grep -i SMTG_VST3_SDK

      - name: Build VST3 full version
        working-directory: vst3
        run: |
          cmake -S . -B ../build-full -DCMAKE_BUILD_TYPE=Release -DNAGINATA_TRIAL_EXPIRY=0
          cmake --build ../build-full --config Release --target NAGINATA validator --parallel

      - name: Build VST3 30-day trial version
        working-directory: vst3
        run: |
          EXP=$(( $(date -u +%s) + 30*86400 ))
          echo "Trial expires at unix time $EXP"
          cmake -S . -B ../build-trial -DCMAKE_BUILD_TYPE=Release -DNAGINATA_TRIAL_EXPIRY=$EXP
          cmake --build ../build-trial --config Release --target NAGINATA validator --parallel

      - name: Build CLAP full and 30-day trial versions
        run: |
          EXP=$(( $(date -u +%s) + 30*86400 ))
          cmake -S clap -B build-clap-full -DCMAKE_BUILD_TYPE=Release -DNAGINATA_TRIAL_EXPIRY=0
          cmake --build build-clap-full --config Release --parallel
          cmake -S clap -B build-clap-trial -DCMAKE_BUILD_TYPE=Release -DNAGINATA_TRIAL_EXPIRY=$EXP
          cmake --build build-clap-trial --config Release --parallel

      - name: Validate VST3 bundles with the Steinberg validator
        run: |
          VALIDATOR=$(find build-full -type f \( -name validator -o -name validator.exe \) | head -1)
          FULL=$(find build-full -type d -name NAGINATA.vst3 | head -1)
          TRIAL=$(find build-trial -type d -name NAGINATA.vst3 | head -1)
          echo "validator: $VALIDATOR"
          "$VALIDATOR" "$FULL"
          "$VALIDATOR" "$TRIAL"

      - name: Collect bundles
        run: |
          mkdir -p out/full out/trial
          cp -R "$(find build-full -type d -name NAGINATA.vst3 | head -1)" out/full/
          cp -R "$(find build-trial -type d -name NAGINATA.vst3 | head -1)" out/trial/
          cp "$(find build-clap-full -type f -name NAGINATA.clap | head -1)" out/full/
          cp "$(find build-clap-trial -type f -name NAGINATA.clap | head -1)" out/trial/

      - name: Upload full version
        uses: actions/upload-artifact@v4
        with:
          name: NAGINATA-full-windows
          path: out/full

      - name: Upload 30-day trial version
        uses: actions/upload-artifact@v4
        with:
          name: NAGINATA-trial-30days-windows
          path: out/trial

  test-clap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out NAGINATA
        uses: actions/checkout@v4

      - name: Build the CLAP plugin and run the host test
        run: |
          cmake -S clap -B build-test -DCMAKE_BUILD_TYPE=Release
          cmake --build build-test --parallel
          g++ -std=c++17 -O2 -Iclap/include -I. clap/test/clap_host_test.cpp -ldl -o clap_host_test
          ./clap_host_test build-test/NAGINATA.clap
